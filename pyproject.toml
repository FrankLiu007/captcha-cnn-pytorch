[project]
name = "pytorch-captcha-cnn"
version = "0.1.0"
description = "用 PyTorch + CNN 从零实现验证码识别（CTC + 多头分类）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
